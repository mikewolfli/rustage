name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Test documentation checker
        run: node --test tools/check-docs.test.mjs
      - name: Check repository documentation
        run: node tools/check-docs.mjs
      - name: Test host resource checker
        run: node --test tools/resources/check-resources.test.mjs
      - name: Check host resources
        run: node tools/resources/check-resources.mjs
      - name: Test support matrix checker
        run: node --test tools/support-matrix/check-support-matrix.test.mjs
      - name: Check support matrix
        run: node tools/support-matrix/check-support-matrix.mjs
      - name: Test decision register checker
        run: node --test tools/decisions/check-decisions.test.mjs
      - name: Check decision register
        run: node tools/decisions/check-decisions.mjs
      - name: Test contract checker
        run: node --test tools/contracts/check-contracts.test.mjs
      - name: Check contracts
        run: node tools/contracts/check-contracts.mjs
      - name: Test journey walkthrough checker
        run: node --test tools/journeys/check-journeys.test.mjs
      - name: Check journey walkthrough
        run: node tools/journeys/check-journeys.mjs
      - name: Test fixture generator
        run: node --test tools/fixtures/check-fixtures.test.mjs
      - name: Check fixture reproducibility
        run: node tools/fixtures/generate-fixtures.mjs --verify
      - name: Test benchmark environment checker
        run: node --test tools/benchmark/check-benchmark.test.mjs
      - name: Check benchmark environment
        run: node tools/benchmark/check-benchmark.mjs
      - name: Test traceability checker
        run: node --test tools/traceability/check-traceability.test.mjs
      - name: Check traceability
        run: node tools/traceability/check-traceability.mjs
      - name: Test capability reference checker
        run: node --test tools/capability/check-capability.test.mjs
      - name: Check capability reference
        run: node tools/capability/check-capability.mjs
