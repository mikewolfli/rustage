[package]
name = "rustage"
version = "0.1.0"
edition = "2024"
description = "A desktop visual UI designer for Rust-Widgets"
license = "MIT"
# Not published to crates.io, on purpose. This crate is the desktop application, not a library a
# downstream project would depend on; the project distributes packaged builds (roadmap F25/T25.02),
# and the pinned widget dependency is a git revision, which a registry would refuse anyway. Saying
# it here is the difference between "deliberately not for publication" and "someone forgot to set
# `publish`", which is exactly how the bare `publish = false` reads.
publish = false
[features]
# The pinned revision compiles a Linux desktop backend in two shapes, and the *name* it reports is
# the same in both (`linux-state-backend` in the one that opens no window, `gtk` in the one that
# does): `gtk-native` is what selects the shape with a real toolkit behind it, and without it a
# Linux host answers `PreviewOrStub` and can only be run in a state backend. That is the difference
# between "the baseline desktop session started" and "a stub ran a loop", which T01.01's acceptance
# line exists to keep apart, so a Linux host that means to run on a desktop needs this feature.
#
# Off by default, and forwarded rather than renamed: `docs/plan/decisions.md` fixes the dependency
# strategy as `default-features = false, features = ["desktop"]`, and a host that verified the
# native path builds it explicitly (`cargo build --features linux-native`). Keeping the revision's
# own feature name visible is what makes the two builds comparable by name in a record.
linux-native = ["rust_widgets/gtk-native"]

[dependencies]
rust_widgets = { git = "https://github.com/mikewolfli/rust-widgets", rev = "ba1db3c274beab0a760a69eac1f9adf458c727eb", default-features = false, features = ["desktop", "runtime-fonts"] }

# Extension packages and the release SBOM need a real digest; `sha2` is already resolved through the
# widget dependency, so this adds no download. A hand-rolled checksum would not be comparable with
# the digests a package author publishes (principle #25).
sha2 = "0.10"

# The pinned revision now owns the toolkit: it creates and focuses the GTK input method context
# itself, so the host has no direct GTK dependency. Keeping the feature forwarding-only is also
# what makes a Linux host declare *which* library profile it built (`gtk-native`) rather than
# silently linking a second GTK stack.
# The process tree cleanup T01.04 needs: signalling a *process group* and asking whether a pid is
# alive are `kill(2)`, which the standard library does not expose. Declared for the targets that have
# it rather than for every target (principle #47), and pinned to a major version whose resolution is
# already in `Cargo.lock` through the widget dependency, so this adds no new download.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows' pseudo-terminal is ConPTY, and its setup (a pseudo-console handle plus a
# `PROC_THREAD_ATTRIBUTE_PSEUDOCONSOLE`) is protocol plumbing rather than designer logic. `portable-pty`
# provides exactly that seam and is declared only for Windows, so the Unix build keeps its own
# small `posix_openpt` implementation and links nothing extra.
[target.'cfg(windows)'.dependencies]
portable-pty = "0.9"
